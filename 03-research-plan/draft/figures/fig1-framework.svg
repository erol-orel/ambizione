<text x="186.0" y="47" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">CONTEXT DATA, shared by both</text>
<text x="186.0" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">weather, air quality, calendar effects,</text>
<text x="186.0" y="91" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">wastewater and surveillance feeds,</text>
<text x="186.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">from public sources or partners</text>
<rect x="0" y="158" width="372" height="118" rx="6" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.4"/>
<text x="186.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">LOCAL OUTCOMES, shared by both</text>
<text x="186.0" y="208" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">long historical records of the service</text>
<text x="186.0" y="229" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">only a few outcomes from the new episode</text>
<text x="186.0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">emergency demand by cause (CASU-144)</text>
<rect x="0" y="296" width="372" height="154" rx="6" fill="#e3edf4" stroke="#1f5f8b" stroke-width="1.8"/>
<text x="186.0" y="323" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f5f8b" text-anchor="middle" font-weight="bold" font-style="normal">PUBLISHED STUDIES (WP1)</text>
<text x="186.0" y="346" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">extracted automatically, with provenance</text>
<text x="186.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">and certainty grades, benchmarked (H1)</text>
<text x="186.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">parameter values, variables and lags,</text>
<text x="186.0" y="409" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">model forms, outcome thresholds</text>
<text x="186.0" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">relevance to Geneva assessed (T1.5)</text>
<rect x="452" y="40" width="400" height="112" rx="6" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.4"/>
<text x="652.0" y="67" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">REFERENCE STRATEGY</text>
<text x="652.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">candidate models fitted to context data</text>
<text x="652.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">and local outcomes only</text>
<text x="652.0" y="132" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">best chosen by registered rules</text>
<rect x="452" y="190" width="400" height="134" rx="6" fill="#e3edf4" stroke="#1f5f8b" stroke-width="1.8"/>
<text x="652.0" y="217" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f5f8b" text-anchor="middle" font-weight="bold" font-style="normal">EVIDENCE-INFORMED STRATEGY</text>
<text x="652.0" y="240" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">the same candidates and inputs, plus the</text>
<text x="652.0" y="261" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">published-evidence distributions, variables</text>
<text x="652.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">and model forms, with fixed or adaptive</text>
<text x="652.0" y="303" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">weighting under evidence conflict</text>
<rect x="452" y="352" width="400" height="98" rx="6" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.4"/>
<text x="652.0" y="379" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">PRESSURE LEVELS (WP2)</text>
<text x="652.0" y="402" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">routine, elevated, strained, critical</text>
<text x="652.0" y="423" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">defaults, seeded from the evidence</text>
<rect x="932" y="20" width="468" height="150" rx="6" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.4"/>
<text x="1166.0" y="47" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">EVALUATION AGAINST LATER OUTCOMES (WP3)</text>
<text x="1166.0" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">each past episode replayed from its onset,</text>
<text x="1166.0" y="91" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">every forecast date uses only what was known then</text>
<text x="1166.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">H3a, evidence-informed vs reference, CRPS skill</text>
<text x="1166.0" y="133" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">respiratory first, heat only if respiratory passes</text>
<rect x="932" y="190" width="468" height="112" rx="6" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.4"/>
<text x="1166.0" y="217" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">DECISION VALUE (WP4)</text>
<text x="1166.0" y="240" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">losses and escalation thresholds elicited</text>
<text x="1166.0" y="261" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">from emergency services, net benefit</text>
<text x="1166.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">dashboard in observation mode, where authorised</text>
<rect x="932" y="322" width="468" height="112" rx="6" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.4"/>
<text x="1166.0" y="349" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">LIVING UPDATE</text>
<text x="1166.0" y="372" font-family="Helvetica, Arial, sans-serif" font-size="16.5" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">daily literature check, syntheses refreshed</text>
