<text x="560" y="354" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal">The advantage is hypothesised to exist early and to</text><text x="560" y="369" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal">decay to nothing. WP3 measures the shape of that curve</text><text x="560" y="384" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal">by rolling-origin refitting that uses only data — and only</text><text x="560" y="399" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal">literature — available at each historical origin.</text><text x="560" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="560" y="429" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal">H3b asks the harder question: when the prior is wrong,</text><text x="560" y="444" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c5c5c" text-anchor="start" font-weight="normal" font-style="normal">is the harm bounded and detectable early enough to act?</text>
