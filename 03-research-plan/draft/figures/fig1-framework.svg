<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="896" viewBox="0 0 1456 896">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4e4e4e"/></marker></defs>
<rect width="1456" height="896" fill="white"/>
<g transform="translate(28,28)">
<text x="0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">WHAT IS AVAILABLE WHEN A CRISIS STARTS</text>
<line x1="0" y1="40" x2="1400" y2="40" stroke="#9a9a9a" stroke-width="0.8" opacity="0.6"/>
<rect x="0" y="60" width="440" height="160" rx="10" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="2.2"/>
<text x="220.0" y="98" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f5f8b" text-anchor="middle" font-weight="bold" font-style="normal">Published evidence</text>
<text x="220.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Parameter estimates and their uncertainty</text>
<text x="220.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Predictors, lags, model types, thresholds</text>
<text x="220.0" y="194" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">From other settings and past events</text>
<rect x="480" y="60" width="440" height="160" rx="10" fill="#eaf5ef" stroke="#2e8b57" stroke-width="2.2"/>
<text x="700.0" y="98" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2e8b57" text-anchor="middle" font-weight="bold" font-style="normal">Context data</text>
<text x="700.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Weather, air quality and calendar effects</text>
<text x="700.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Wastewater and surveillance indicators</text>
<text x="700.0" y="194" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">Often public or available through partners</text>
<rect x="960" y="60" width="440" height="160" rx="10" fill="#fdf3e6" stroke="#c8701a" stroke-width="2.2"/>
<text x="1180.0" y="98" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#c8701a" text-anchor="middle" font-weight="bold" font-style="normal">Local outcome candidates</text>
<text x="1180.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Calls, ED visits, admissions, occupancy</text>
<text x="1180.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Chosen from the data and the evidence</text>
<text x="1180.0" y="194" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">Few or delayed early in an episode</text>
<rect x="0" y="240" width="1400" height="70" rx="8" fill="#f3f5f7" stroke="#8a97a6" stroke-width="1.2"/>
<text x="700.0" y="269" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f3a5f" text-anchor="middle" font-weight="bold" font-style="normal">The gap is rarely the context data. It is too little local outcome history to learn how context relates to this episode</text>
<text x="700.0" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">The target is chosen before any model comparison, using registered criteria for relevance, access and data quality</text>
<text x="0" y="358" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">WHAT HEADSTART DOES</text>
<line x1="0" y1="368" x2="1400" y2="368" stroke="#9a9a9a" stroke-width="0.8" opacity="0.6"/>
<rect x="0" y="390" width="320" height="126" rx="10" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="1.8"/>
<text x="160.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f5f8b" text-anchor="middle" font-weight="bold" font-style="normal">WP1 Build evidence inputs</text>
<text x="160.0" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Extract studies, assess their</text>
<text x="160.0" y="492" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">uncertainty and relevance</text>
<line x1="324" y1="453.0" x2="356" y2="453.0" stroke="#4e4e4e" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="360" y="390" width="320" height="126" rx="10" fill="#eaf5ef" stroke="#2e8b57" stroke-width="1.8"/>
<text x="520.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2e8b57" text-anchor="middle" font-weight="bold" font-style="normal">WP2 Model levels of pressure</text>
<text x="520.0" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Combine context and outcomes,</text>
<text x="520.0" y="492" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">estimate levels of pressure</text>
<line x1="684" y1="453.0" x2="716" y2="453.0" stroke="#4e4e4e" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="720" y="390" width="320" height="126" rx="10" fill="#f3f5f7" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="880.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f3a5f" text-anchor="middle" font-weight="bold" font-style="normal">WP3 Replay past episodes</text>
<text x="880.0" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Compare two strategies with the</text>
<text x="880.0" y="492" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">same feeds and the same target</text>
<line x1="1044" y1="453.0" x2="1076" y2="453.0" stroke="#4e4e4e" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1080" y="390" width="320" height="126" rx="10" fill="#fdf3e6" stroke="#c8701a" stroke-width="1.8"/>
<text x="1240.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#c8701a" text-anchor="middle" font-weight="bold" font-style="normal">WP4 Test decision value</text>
<text x="1240.0" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Would a better forecast change</text>
<text x="1240.0" y="492" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">a defensible decision?</text>
<text x="0" y="566" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">THE TEST (schematic, not observed results)</text>
<line x1="0" y1="576" x2="1400" y2="576" stroke="#9a9a9a" stroke-width="0.8" opacity="0.6"/>
<line x1="110" y1="786" x2="540" y2="786" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="110" y1="600" x2="110" y2="786" stroke="#1a1a1a" stroke-width="1.6"/>
<path d="M 120 624 C 280 638 470 750 530 784" fill="none" stroke="#1f5f8b" stroke-width="4"/>
<text x="100" y="608" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="end" font-weight="normal" font-style="normal">skill score</text>
<text x="100" y="791" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="end" font-weight="normal" font-style="normal">0</text>
<text x="110" y="812" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal">episode onset</text>
<text x="540" y="812" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="end" font-weight="normal" font-style="normal">more outcomes observed</text>
<text x="574" y="644" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f5f8b" text-anchor="start" font-weight="normal" font-style="normal">gain of the evidence-informed</text>
<text x="574" y="668" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f5f8b" text-anchor="start" font-weight="normal" font-style="normal">strategy over the reference</text>
<text x="574" y="706" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal">largest at onset, fading as</text>
<text x="574" y="730" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal">local outcomes accumulate</text>
<text x="574" y="754" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal">(0 = no gain)</text>
<text x="574" y="778" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="574" y="802" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal">reference = same feeds and</text>
<text x="574" y="826" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="start" font-weight="normal" font-style="normal">outcomes, no WP1 evidence inputs</text>
<text x="880" y="566" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">THE GENEVA TEST SEQUENCE</text>
<rect x="880" y="594" width="520" height="48" rx="24" fill="#f3f5f7" stroke="#1f5f8b" stroke-width="1.8"/>
<circle cx="908" cy="618" r="14" fill="white" stroke="#1f5f8b" stroke-width="2"/>
<text x="908" y="623" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f5f8b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="934" y="625" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-style="normal">Respiratory epidemics</text>
<text x="1378" y="625" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4e4e4e" text-anchor="end" font-weight="normal" font-style="normal">primary confirmatory test</text>
<rect x="880" y="654" width="520" height="48" rx="24" fill="#f3f5f7" stroke="#2e8b57" stroke-width="1.8"/>
<circle cx="908" cy="678" r="14" fill="white" stroke="#2e8b57" stroke-width="2"/>
<text x="908" y="683" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2e8b57" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="934" y="685" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2e8b57" text-anchor="start" font-weight="bold" font-style="normal">Heat events</text>
<text x="1378" y="685" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4e4e4e" text-anchor="end" font-weight="normal" font-style="normal">second test</text>
<rect x="880" y="714" width="520" height="48" rx="24" fill="#f3f5f7" stroke="#c8701a" stroke-width="1.8"/>
<circle cx="908" cy="738" r="14" fill="white" stroke="#c8701a" stroke-width="2"/>
<text x="908" y="743" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c8701a" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="934" y="745" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c8701a" text-anchor="start" font-weight="bold" font-style="normal">Legionellosis</text>
<text x="1378" y="745" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4e4e4e" text-anchor="end" font-weight="normal" font-style="normal">third test</text>
<text x="1140" y="798" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">Outcome, levels and thresholds registered before any test</text>
<text x="1140" y="824" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4e4e4e" text-anchor="middle" font-weight="normal" font-style="normal">Dashboard for validated demand tests, where authorised</text>
</g></svg>