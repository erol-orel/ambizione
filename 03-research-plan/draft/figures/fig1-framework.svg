<svg xmlns="http://www.w3.org/2000/svg" width="3300" height="1305" viewBox="0 0 3300 1305">
<rect width="3300" height="1305" fill="white"/>
<text x="55" y="68" font-family="Helvetica, Arial, sans-serif" font-size="52" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">Context data may be plentiful, while outcomes from the current episode are initially few.</text>
<rect x="55" y="115" width="1005" height="255" rx="28" fill="#eaf5ef" stroke="#2e8b57" stroke-width="5"/>
<text x="93" y="183" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#2e8b57" text-anchor="start" font-weight="bold" font-style="normal">CONTEXT DATA, OFTEN AVAILABLE</text>
<text x="93" y="243" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Weather, air quality and calendar</text>
<text x="93" y="291" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Wastewater and public surveillance</text>
<text x="93" y="339" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">Public feeds or links through partners</text>
<rect x="1148" y="115" width="1005" height="255" rx="28" fill="#fdf3e6" stroke="#c8701a" stroke-width="5"/>
<text x="1186" y="183" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#c8701a" text-anchor="start" font-weight="bold" font-style="normal">OUTCOMES FROM THIS EPISODE</text>
<text x="1186" y="243" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Cause-specific calls and ED demand</text>
<text x="1186" y="291" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Occupancy and service pressure</text>
<text x="1186" y="339" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">Only a few observations at the start</text>
<rect x="2240" y="115" width="1005" height="255" rx="28" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="5"/>
<text x="2278" y="183" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-style="normal">PUBLISHED STUDIES</text>
<text x="2278" y="243" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Effect estimates and uncertainty</text>
<text x="2278" y="291" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Variables, lags, model forms, thresholds</text>
<text x="2278" y="339" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">Evidence from other events and settings</text>
<rect x="55" y="425" width="2098" height="170" rx="28" fill="#eef2f6" stroke="#8a97a6" stroke-width="5"/>
<text x="93" y="493" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">SAME RAW INPUTS TO BOTH STRATEGIES</text>
<text x="93" y="553" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Context feeds + historical local outcomes + outcomes observed so far</text>
<rect x="2240" y="425" width="1005" height="170" rx="28" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="5"/>
<text x="2278" y="493" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-style="normal">PREPARE THE EVIDENCE</text>
<text x="2278" y="540" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Extract, then check uncertainty and relevance</text>
<text x="2278" y="580" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">to Geneva before using it in a model</text>
<rect x="55" y="650" width="1495" height="265" rx="28" fill="white" stroke="#1f3a5f" stroke-width="5"/>
<text x="93" y="718" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1f3a5f" text-anchor="start" font-weight="bold" font-style="normal">REFERENCE STRATEGY</text>
<text x="93" y="778" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Fits registered models to the shared data.</text>
<text x="93" y="826" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">No model inputs derived from HEADSTART extraction.</text>
<text x="93" y="868" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">Same selection and validity rules.</text>
<rect x="1620" y="650" width="1625" height="265" rx="28" fill="#e8f0f7" stroke="#1f5f8b" stroke-width="5"/>
<text x="1658" y="718" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-style="normal">STRATEGY USING PUBLISHED EVIDENCE</text>
<text x="1658" y="778" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Uses the same data, plus findings from published studies.</text>
<text x="1658" y="826" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">Parameter distributions retain extraction uncertainty.</text>
<text x="1658" y="868" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="normal">Evidence also informs variables, lags and model forms.</text>
<rect x="55" y="980" width="3190" height="255" rx="28" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="5"/>
<text x="93" y="1048" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="white" text-anchor="start" font-weight="bold" font-style="normal">REPLAY PAST EPISODES USING ONLY WHAT WAS AVAILABLE AT EACH DATE</text>
<text x="93" y="1108" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="white" text-anchor="start" font-weight="normal" font-style="normal">Compare probability forecasts with later outcomes, and assess calibration and operational value.</text>
<text x="93" y="1156" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#dbe3ec" text-anchor="start" font-weight="normal" font-style="normal">A dashboard is considered only for validated demand-based applications and with service authorisation.</text>
<line x1="557" y1="370" x2="557" y2="399" stroke="#2e8b57" stroke-width="7"/>
<path d="M 539 395 L 575 395 L 557 425 z" fill="#2e8b57"/>
